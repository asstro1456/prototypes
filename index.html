<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUNO TRACK HUB (Sheets)</title>
  <style>
    :root{
      --bg:#070a12; --panel:#0c1020; --panel2:#0a0e1b;
      --line:rgba(255,255,255,.08);
      --muted:rgba(255,255,255,.55);
      --text:rgba(255,255,255,.92);
      --chip:rgba(255,255,255,.06);
      --accent:#7b5cff; --accent2:#a78bfa;
      --ok:#22c55e; --warn:#f59e0b;
      --r:16px; --shadow:0 18px 60px rgba(0,0,0,.55);
    }
    *{box-sizing:border-box}
    body{
      margin:0; color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial, "Apple SD Gothic Neo", sans-serif;
      background: radial-gradient(900px 700px at 70% 10%, rgba(123,92,255,.18), transparent 60%),
                  radial-gradient(700px 600px at 20% 40%, rgba(167,139,250,.10), transparent 60%),
                  linear-gradient(180deg, #060812, #05060c);
    }
    a{color:inherit; text-decoration:none}
    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter: blur(12px);
      background: color-mix(in srgb, var(--bg) 70%, transparent);
      border-bottom:1px solid var(--line);
    }
    .nav{max-width:1200px; margin:0 auto; padding:14px 16px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center;}
    .brand{display:flex; gap:10px; align-items:center; font-weight:950; letter-spacing:.3px}
    .dot{width:10px;height:10px;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 0 6px rgba(123,92,255,.12)}
    .pill{
      border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--text);
      border-radius:999px; padding:9px 12px; font-size:12px; cursor:pointer;
    }
    .pill.accent{background:linear-gradient(135deg, rgba(123,92,255,.28), rgba(167,139,250,.18));
      border-color: color-mix(in srgb, var(--accent) 45%, var(--line));}
    .wrap{max-width:1200px; margin:0 auto; padding:22px 16px 70px;}
    .h1{font-size:34px; font-weight:950; letter-spacing:-.6px; margin:14px 0 6px}
    .sub{color:var(--muted); font-size:13px; margin:0 0 18px; line-height:1.6}

    .topbar{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px;}
    .search{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
    input{
      border:1px solid var(--line);
      background: rgba(255,255,255,.035); color:var(--text);
      border-radius:12px; padding:11px 12px; outline:none; font-size:14px;
      width:320px;
    }
    @media (max-width:560px){ input{width:100%} }

    .note{color:var(--muted); font-size:12px; line-height:1.55}
    .sep{height:1px; background:var(--line); margin:12px 0;}

    .gridCards{margin-top:12px; display:grid; grid-template-columns: repeat(4,1fr); gap:12px;}
    @media (max-width:1180px){ .gridCards{grid-template-columns:repeat(3,1fr)} }
    @media (max-width:900px){ .gridCards{grid-template-columns:repeat(2,1fr)} }
    @media (max-width:560px){ .gridCards{grid-template-columns:1fr} }

    .tCard{border:1px solid var(--line); background:linear-gradient(180deg, rgba(12,16,32,.80), rgba(10,14,27,.90)); border-radius:var(--r); overflow:hidden; box-shadow: var(--shadow);}
    .tThumb{aspect-ratio:16/9; background:rgba(255,255,255,.03); position:relative;}
    .tThumb img{width:100%; height:100%; object-fit:cover; display:block;}
    .tThumb::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 60%, rgba(0,0,0,.52))}
    .tBody{padding:12px 12px 14px; display:grid; gap:7px}
    .badge{
      display:inline-flex; align-items:center; gap:6px;
      font-size:11px; font-weight:900; letter-spacing:.08em;
      padding:6px 10px; border-radius:999px; border:1px solid var(--line);
      background: rgba(255,255,255,.04); color: color-mix(in srgb, var(--text) 86%, var(--muted));
      width:fit-content;
    }
    .badge.ok{border-color: color-mix(in srgb, var(--ok) 45%, var(--line));}
    .tTitle{font-weight:950; letter-spacing:-.2px; font-size:14px; margin:0}
    .tMeta{color:var(--muted); font-size:12px; display:flex; gap:8px; flex-wrap:wrap}
    .tDesc{color: color-mix(in srgb, var(--text) 78%, var(--muted)); font-size:12.5px; line-height:1.45; margin:0; white-space:pre-wrap;}
    .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px}
    .chip{font-size:12px; padding:6px 9px; border-radius:999px; background:var(--chip); border:1px solid var(--line); color: color-mix(in srgb, var(--text) 86%, var(--muted));}
    .btns{display:flex; gap:8px; margin-top:4px}
    .btn{
      border:1px solid var(--line);
      background: rgba(255,255,255,.04);
      border-radius:12px; padding:9px 10px; cursor:pointer; font-weight:800; font-size:13px;
      color:var(--text);
      flex:1;
    }
    .btn.accent{background:linear-gradient(135deg, rgba(123,92,255,.34), rgba(167,139,250,.18));
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));}
    .btn.small{flex:0 0 auto; padding:9px 12px}
    .error{
      border:1px solid color-mix(in srgb, #ff4d4d 45%, var(--line));
      background:rgba(255,77,77,.08);
      border-radius:12px; padding:12px; color:color-mix(in srgb, #ffd0d0 88%, var(--muted));
      margin-top:12px;
    }
  </style>
</head>
<body>
<header>
  <div class="nav">
    <div class="brand"><span class="dot"></span> SUNO TRACK HUB</div>
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <button class="pill" id="btnReload">RELOAD</button>
      <a class="pill accent" href="https://docs.google.com/spreadsheets/d/1E742yCiKdQKf6ZEcIJ7HPrhpvItKKIJaCPVmkFdanSM/edit?usp=sharing" target="_blank" rel="noopener noreferrer">OPEN SHEET</a>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="h1">GAMES</div>
  <p class="sub">
    Google Sheets(CSV)에서 자동으로 읽어와 렌더합니다.<br/>
    정렬: <b>최신순(시트 행 역순)</b> · 클릭: <b>새 탭</b>
  </p>

  <div class="topbar">
    <div class="search">
      <input id="q" placeholder="검색: 제목/설명/장르" />
      <button class="pill" id="btnClear">CLEAR</button>
    </div>
    <div class="note" id="count">—</div>
  </div>

  <div class="sep"></div>

  <div id="err" class="error" style="display:none;"></div>
  <div id="cards" class="gridCards"></div>
  <div id="empty" class="note" style="display:none;">표시할 곡이 없습니다.</div>
</div>

<script>
  // ✅ 네가 준 CSV URL
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSqbfKg_X9gd_OJeMhGo2BMslOt2y2QoMxY8mfAUHW5Jnf4Yi122-GA2owuBtpk4obaFR1jTXvzrwF0/pubhtml";

  // 컬럼 매핑 (A~F): 타임스탬프, 제목, URL, 설명, 썸네일URL, 장르
  const COL = { ts:0, title:1, url:2, desc:3, thumb:4, genre:5 };

  const $ = (id)=>document.getElementById(id);
  const esc = (s) => (s ?? "").toString()
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");

  function placeholder(){
    const svg = encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
        <defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0" stop-color="#1b2030"/><stop offset="1" stop-color="#060812"/>
        </linearGradient></defs>
        <rect width="100%" height="100%" fill="url(#g)"/>
        <text x="50%" y="50%" fill="rgba(255,255,255,.55)" font-size="44" font-family="Arial, sans-serif"
          text-anchor="middle" dominant-baseline="middle">No Cover</text>
      </svg>
    `);
    return `data:image/svg+xml;charset=utf-8,${svg}`;
  }

  // Robust-ish CSV parser (handles quotes + commas)
  function parseCSV(text){
    const rows = [];
    let row = [];
    let cur = "";
    let inQuotes = false;

    for (let i=0; i<text.length; i++){
      const c = text[i];
      const n = text[i+1];

      if (inQuotes){
        if (c === '"' && n === '"'){ cur += '"'; i++; continue; }
        if (c === '"'){ inQuotes = false; continue; }
        cur += c;
        continue;
      }

      if (c === '"'){ inQuotes = true; continue; }
      if (c === ','){ row.push(cur); cur=""; continue; }

      // \r\n or \n
      if (c === '\n' || c === '\r'){
        if (c === '\r' && n === '\n') i++;
        row.push(cur); cur="";
        // skip empty last line
        if (row.length > 1 || (row.length === 1 && row[0].trim() !== "")) rows.push(row);
        row = [];
        continue;
      }

      cur += c;
    }

    // last cell
    if (cur.length || row.length){
      row.push(cur);
      if (row.length > 1 || (row.length === 1 && row[0].trim() !== "")) rows.push(row);
    }
    return rows;
  }

  function norm(s){ return (s||"").toString().toLowerCase().trim(); }

  let tracks = [];

  function mapRowsToTracks(rows){
    // 첫 줄은 헤더로 가정하고 제거
    const body = rows.slice(1);

    // 최신순 = 시트에 신규 응답이 아래로 쌓이므로 역순 렌더(타임스탬프 파싱 실패 회피)
    const latestFirst = body.reverse();

    const out = [];
    for (const r of latestFirst){
      const title = (r[COL.title] || "").trim();
      const url = (r[COL.url] || "").trim();
      if (!title || !url) continue;

      out.push({
        ts: (r[COL.ts] || "").trim(),
        title,
        url,
        desc: (r[COL.desc] || "").trim(),
        thumb: (r[COL.thumb] || "").trim(),
        genre: (r[COL.genre] || "").trim(),
      });
    }
    return out;
  }

  function cardHtml(t){
    const img = (t.thumb && /^https?:\/\//i.test(t.thumb)) ? t.thumb : placeholder();
    const badge = `<span class="badge ok">LIVE</span>`;
    const meta = [
      t.genre ? `genre: ${esc(t.genre)}` : "genre: —",
      t.ts ? `ts: ${esc(t.ts)}` : ""
    ].filter(Boolean).join(" • ");

    const chips = t.genre ? `<span class="chip">${esc(t.genre)}</span>` : "";

    return `
      <article class="tCard">
        <a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">
          <div class="tThumb"><img alt="cover" src="${esc(img)}"/></div>
        </a>
        <div class="tBody">
          ${badge}
          <p class="tTitle">${esc(t.title)}</p>
          <div class="tMeta">${meta}</div>
          <p class="tDesc">${esc(t.desc||"")}</p>
          <div class="chips">${chips}</div>
          <div class="btns">
            <a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer" style="flex:1;">
              <button class="btn accent" style="width:100%">OPEN</button>
            </a>
            <button class="btn small" data-copy="${esc(t.url)}">COPY</button>
          </div>
        </div>
      </article>
    `;
  }

  function wireCopy(){
    document.querySelectorAll("[data-copy]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const url = btn.getAttribute("data-copy") || "";
        try{
          await navigator.clipboard.writeText(url);
          const old = btn.textContent;
          btn.textContent = "COPIED";
          setTimeout(()=>btn.textContent = old, 900);
        }catch{
          prompt("복사할 링크:", url);
        }
      }, { once:true });
    });
  }

  function render(){
    const q = norm($("q").value);
    const list = tracks.filter(t=>{
      const hay = norm([t.title, t.desc, t.genre].join(" | "));
      return !q || hay.includes(q);
    });

    $("count").textContent = `표시: ${list.length}`;
    $("cards").innerHTML = list.map(cardHtml).join("");
    $("empty").style.display = list.length ? "none" : "block";
    wireCopy();
  }

  async function load(){
    $("err").style.display="none";
    $("err").textContent="";
    $("count").textContent="로딩 중…";
    $("cards").innerHTML="";
    $("empty").style.display="none";

    try{
      const res = await fetch(CSV_URL, { cache: "no-store" });
      if(!res.ok) throw new Error(`CSV fetch failed: ${res.status} ${res.statusText}`);
      const text = await res.text();
      const rows = parseCSV(text);
      if (rows.length < 2) throw new Error("CSV rows are empty (publish 상태/탭 선택 확인 필요).");

      tracks = mapRowsToTracks(rows);
      render();
    }catch(e){
      $("count").textContent="—";
      $("err").style.display="block";
      $("err").textContent = "로드 실패: " + (e?.message || e);
    }
  }

  $("q").addEventListener("input", render);
  $("btnReload").addEventListener("click", load);
  $("btnClear").addEventListener("click", ()=>{ $("q").value=""; render(); });

  load();
</script>
</body>
</html>
