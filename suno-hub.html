<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI SONGS</title>

  <style>
    :root{
      --bg:#070a12; --panel:#0c1020; --panel2:#0a0e1b;
      --line:rgba(255,255,255,.08);
      --muted:rgba(255,255,255,.55);
      --text:rgba(255,255,255,.92);
      --chip:rgba(255,255,255,.06);
      --accent:#7b5cff; --accent2:#a78bfa;
      --r:16px; --shadow:0 18px 60px rgba(0,0,0,.55);
    }
    *{box-sizing:border-box}
    html, body{height:100%}
    body{
      margin:0; color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial, "Apple SD Gothic Neo", sans-serif;
      background: radial-gradient(900px 700px at 70% 10%, rgba(123,92,255,.18), transparent 60%),
                  radial-gradient(700px 600px at 20% 40%, rgba(167,139,250,.10), transparent 60%),
                  linear-gradient(180deg, #060812, #05060c);
    }
    a{color:inherit; text-decoration:none}

    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter: blur(12px);
      background: color-mix(in srgb, var(--bg) 70%, transparent);
      border-bottom:1px solid var(--line);
    }
    .nav{
      max-width:1200px; margin:0 auto; padding:14px 16px;
      display:flex; justify-content:space-between; gap:12px;
      flex-wrap:wrap; align-items:center;
    }
    .brand{display:flex; gap:10px; align-items:center; font-weight:950; letter-spacing:.3px}
    .dot{
      width:10px;height:10px;border-radius:999px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow:0 0 0 6px rgba(123,92,255,.12)
    }
    .pill{
      border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--text);
      border-radius:999px; padding:9px 12px; font-size:12px; cursor:pointer;
    }
    .pill.accent{
      background:linear-gradient(135deg, rgba(123,92,255,.28), rgba(167,139,250,.18));
      border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
    }

    .wrap{max-width:1200px; margin:0 auto; padding:22px 16px 70px; min-height:100vh;}
    .h1{font-size:34px; font-weight:950; letter-spacing:-.6px; margin:14px 0 6px}
    .sub{color:var(--muted); font-size:13px; margin:0 0 18px; line-height:1.6}
    .topbar{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px;}
    .search{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}

    input{
      border:1px solid var(--line);
      background: rgba(255,255,255,.035); color:var(--text);
      border-radius:12px; padding:11px 12px; outline:none; font-size:14px;
      width: min(360px, 100%);
    }
    .note{color:var(--muted); font-size:12px; line-height:1.55}
    .sep{height:1px; background:var(--line); margin:12px 0;}

    /* ✅ 핵심: 카드가 1개여도 과대해지지 않게 최대폭 제한 */
    .gridCards{
      margin-top:12px;
      display:grid;
      gap:12px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 360px));
      justify-content:start;
      align-items:start;
    }

    .tCard{
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(12,16,32,.80), rgba(10,14,27,.90));
      border-radius:var(--r);
      overflow:hidden;
      box-shadow: var(--shadow);
    }

    /* ✅ 핵심: 썸네일 고정 높이로 줄이기 */
    .tThumb{
      height:220px;               /* 180~260 사이 조절 */
      overflow:hidden;
      background:rgba(255,255,255,.03);
      position:relative;
    }
    .tThumb img{width:100%; height:100%; object-fit:cover; display:block;}
    .tThumb::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 55%, rgba(0,0,0,.55))}

    .tBody{padding:12px 12px 14px; display:grid; gap:7px}
    .badge{
      display:inline-flex; align-items:center; gap:6px;
      font-size:11px; font-weight:900; letter-spacing:.08em;
      padding:6px 10px; border-radius:999px; border:1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: color-mix(in srgb, var(--text) 86%, var(--muted));
      width:fit-content;
    }
    .tTitle{font-weight:950; letter-spacing:-.2px; font-size:14px; margin:0}
    .tDesc{color: color-mix(in srgb, var(--text) 78%, var(--muted)); font-size:12.5px; line-height:1.45; margin:0; white-space:pre-wrap;}
    .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px}
    .chip{font-size:12px; padding:6px 9px; border-radius:999px; background:var(--chip); border:1px solid var(--line); color: color-mix(in srgb, var(--text) 86%, var(--muted));}

    .error{
      border:1px solid color-mix(in srgb, #ff4d4d 45%, var(--line));
      background:rgba(255,77,77,.08);
      border-radius:12px; padding:12px;
      color:color-mix(in srgb, #ffd0d0 88%, var(--muted));
      margin-top:12px;
      white-space:pre-wrap;
    }

    /* 표시 카운트 숨김 */
    #count{display:none !important;}

    /* ✅ 하단 버튼 UI가 호스트/브라우저 기본 스타일로 깨지지 않게 강제 */
    .btns{display:flex !important; gap:8px !important; margin-top:4px !important;}
    .btn,
    .btn:link,
    .btn:visited{
      display:inline-flex !important;
      align-items:center !important;
      justify-content:center !important;
      text-decoration:none !important;

      border:1px solid var(--line) !important;
      background: rgba(255,255,255,.04) !important;
      color: var(--text) !important;

      border-radius:12px !important;
      padding:9px 10px !important;
      font-weight:800 !important;
      font-size:13px !important;

      cursor:pointer !important;
      user-select:none !important;
      flex:1 1 auto !important;
      line-height:1.1 !important;
      min-height:36px !important;

      appearance:none !important;
      -webkit-appearance:none !important;
      outline:none !important;
    }
    .btn.accent{
      background:linear-gradient(135deg, rgba(123,92,255,.34), rgba(167,139,250,.18)) !important;
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line)) !important;
    }
    .btn.small{
      flex:0 0 auto !important;
      min-width:96px !important;
      padding:9px 12px !important;
    }

    /* 임베드(iframe)면 더 컴팩트 */
    .embed header{position:static;}
    .embed .nav{padding:10px 12px;}
    .embed .wrap{max-width:100%; padding:12px 12px 18px;}
    .embed .h1{font-size:22px; margin:10px 0 4px;}
    .embed .sub{font-size:12px; margin-bottom:10px;}
    .embed .gridCards{grid-template-columns: repeat(auto-fit, minmax(200px, 320px));}
    .embed .tThumb{height:180px;}
    .embed .tDesc{
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
      overflow:hidden;
    }
    /* 본문 상단 브랜드 라인 */
.pageBrand{
  display:flex; align-items:center; gap:10px;
  font-weight:950; letter-spacing:.3px;
  margin: 6px 0 6px;
  color: color-mix(in srgb, var(--text) 90%, var(--muted));
}
.dot.sm{ width:8px; height:8px; box-shadow:0 0 0 5px rgba(123,92,255,.10); }

/* 검색 아래 버튼 줄 */
.topbar{ display:grid; gap:10px; align-items:start; }
.search{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

/* 좁은 화면에서 액션 버튼도 자연스럽게 줄바꿈 */
@media (max-width: 560px){
  .actions{ width:100%; }
}
/* NEW 배지: 저채도 레드(로즈) 톤 */
.badge.badge-new{
  border-color: rgba(255, 99, 99, .22);
  background: rgba(255, 99, 99, .10);
  color: rgba(255, 210, 210, .92);
}
  </style>
</head>

<body>
  <div class="pageBrand"><span class="dot sm"></span> SUNO TRACK HUB</div>
<div class="wrap">
  <div class="h1">AI SONGS</div>
  <p class="sub">
    구글 시트에서 목록을 불러옵니다.<br/>
    정렬: <b>최신순</b> · 클릭: <b>새 탭</b>
  </p>

  <div class="topbar">
  <div class="search">
    <input id="q" placeholder="검색: 제목/설명/장르" />
    <button class="pill" id="btnClear">초기화</button>
  </div>

  <div class="actions">
    <button class="pill accent" id="btnReload">새로고침</button>

    <a class="pill accent"
       href="https://forms.gle/fFwcKRR5CAjGrJ8A8"
       target="_blank" rel="noopener noreferrer">곡 등록</a>

    <a class="pill"
       href="https://docs.google.com/spreadsheets/d/1E742yCiKdQKf6ZEcIJ7HPrhpvItKKIJaCPVmkFdanSM/edit?usp=sharing"
       target="_blank" rel="noopener noreferrer">시트 열기</a>
  </div>

  <div class="note" id="count">—</div>
</div>

  <div class="sep"></div>

  <div id="err" class="error" style="display:none;"></div>
  <div id="cards" class="gridCards"></div>
  <div id="empty" class="note" style="display:none;">표시할 곡이 없습니다.</div>
</div>

<script>
  // iframe(임베드) 여부 감지 → embed 컴팩트 모드
  document.documentElement.classList.toggle('embed', window.self !== window.top);

  // ✅ 너 시트 ID + gid 고정
  const GVIZ_URL =
    "https://docs.google.com/spreadsheets/d/1E742yCiKdQKf6ZEcIJ7HPrhpvItKKIJaCPVmkFdanSM/gviz/tq?gid=745673070&tqx=out:json";

  const $ = (id)=>document.getElementById(id);
  const esc = (s) => (s ?? "").toString()
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
  const norm = (s)=> (s||"").toString().toLowerCase().trim();

  function placeholder(){
    const svg = encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="576">
        <defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0" stop-color="#1b2030"/><stop offset="1" stop-color="#060812"/>
        </linearGradient></defs>
        <rect width="100%" height="100%" fill="url(#g)"/>
        <text x="50%" y="50%" fill="rgba(255,255,255,.55)" font-size="44" font-family="Arial, sans-serif"
          text-anchor="middle" dominant-baseline="middle">No Cover</text>
      </svg>
    `);
    return `data:image/svg+xml;charset=utf-8,${svg}`;
  }

  function cardHtml(t){
    const img = (t.thumb && /^https?:\/\//i.test(t.thumb)) ? t.thumb : placeholder();
    const chipHtml = t.genre ? `<span class="chip">${esc(t.genre)}</span>` : "";
    const isNew = isNew3Days(t.ts);
    const badgeHtml = isNew ? `<span class="badge badge-new">NEW</span>` : "";

    return `
      <article class="tCard">
        <a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">
          <div class="tThumb">
            <img alt="cover" src="${esc(img)}" referrerpolicy="no-referrer"
                 onerror="this.onerror=null; this.src='${placeholder()}';"/>
          </div>
        </a>
        <div class="tBody">
  ${badgeHtml}
            <p class="tTitle">${esc(t.title)}</p>
          <p class="tDesc">${esc(t.desc||"")}</p>
          <div class="chips">${chipHtml}</div>
          <div class="btns">
            <a class="btn accent" href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">열기</a>
            <button class="btn small" data-copy="${esc(t.url)}">링크 복사</button>
          </div>
        </div>
      </article>
    `;
  }

  function wireCopy(){
    document.querySelectorAll("[data-copy]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const url = btn.getAttribute("data-copy") || "";
        try{
          await navigator.clipboard.writeText(url);
          const old = btn.textContent;
          btn.textContent = "복사됨";
          setTimeout(()=>btn.textContent = old, 900);
        }catch{
          prompt("복사할 링크:", url);
        }
      }, { once:true });
    });
  }

  let tracks = [];

  function render(){
    const q = norm($("q")?.value);
    const list = tracks.filter(t=>{
      const hay = norm([t.title, t.desc, t.genre].join(" | "));
      return !q || hay.includes(q);
    });

    if ($("count")) $("count").textContent = `표시: ${list.length}`;

    $("cards").innerHTML = list.map(cardHtml).join("");
    $("empty").style.display = list.length ? "none" : "block";
    wireCopy();
  }

  function loadViaGviz() {
    return new Promise((resolve, reject) => {
      window.google = window.google || {};
      google.visualization = google.visualization || {};
      google.visualization.Query = google.visualization.Query || {};
      google.visualization.Query.setResponse = (resp) => resolve(resp);

      const s = document.createElement("script");
      s.src = GVIZ_URL + "&_=" + Date.now(); // 캐시 방지
      s.onerror = () => reject(new Error("gviz script load failed"));
      document.head.appendChild(s);
    });
  }

  function gvizToRows(resp){
    const rows = resp?.table?.rows || [];
    return rows.map(r => (r.c || []).map(cell => cell?.v ?? ""));
  }

  async function load(){
    $("err").style.display="none";
    $("err").textContent="";
    if ($("count")) $("count").textContent="로딩 중…";
    $("cards").innerHTML="";
    $("empty").style.display="none";

    try{
      const resp = await loadViaGviz();
      const rows = gvizToRows(resp);

      const latestFirst = rows.slice().reverse();

      // A~F: ts,title,url,desc,thumb,genre
      tracks = latestFirst
        .map(r => ({
          ts: (r[0] ?? "").toString().trim(),
          title: (r[1] ?? "").toString().trim(),
          url: (r[2] ?? "").toString().trim(),
          desc: (r[3] ?? "").toString().trim(),
          thumb: (r[4] ?? "").toString().trim(),
          genre: (r[5] ?? "").toString().trim(),
        }))
        .filter(t => t.title && t.url);

      render();

      if (tracks.length === 0){
        $("err").style.display="block";
        $("err").textContent =
          "표시할 데이터가 0개입니다.\n" +
          "1) gid 불일치 가능\n" +
          "2) 시트 권한/공개 문제\n" +
          "3) 제목/URL 빈 행만 있는지 확인\n\n" +
          "GVIZ_URL:\n" + GVIZ_URL;
      }
    }catch(e){
      if ($("count")) $("count").textContent="—";
      $("err").style.display="block";
      $("err").textContent = "로드 실패(GViz): " + (e?.message || e);
    }
  }

  $("q")?.addEventListener("input", render);
  $("btnReload")?.addEventListener("click", load);
  $("btnClear")?.addEventListener("click", ()=>{ $("q").value=""; render(); });

  load();
  function isNew3Days(ts){
  // ts가 없으면 NEW 아님
  if (!ts) return false;

  // 1) 일반적인 날짜 문자열이면(Date.parse) 우선 처리
  const parsed = Date.parse(ts);
  if (!Number.isNaN(parsed)) {
    return (Date.now() - parsed) <= 3 * 24 * 60 * 60 * 1000;
  }

  // 2) GViz가 주는 형태: "Date(2026,0,30,0,6,26)" 파싱
  const m = String(ts).match(/Date\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)(?:\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+))?\s*\)/i);
  if (!m) return false;

  const y = +m[1];
  const mo = +m[2];       // 0-based
  const d = +m[3];
  const hh = +(m[4] ?? 0);
  const mm = +(m[5] ?? 0);
  const ss = +(m[6] ?? 0);

  const dt = new Date(y, mo, d, hh, mm, ss).getTime();
  if (Number.isNaN(dt)) return false;

  return (Date.now() - dt) <= 3 * 24 * 60 * 60 * 1000;
}
</script>
</body>
</html>
